# Render Blueprint - PolicyGuard AI backend (Docker runtime)
#
# The Docker runtime is used deliberately: the backend image installs
# Tesseract OCR (see backend/Dockerfile), guaranteeing scanned-PDF OCR works
# in production. The native "python" runtime does not include Tesseract.
#
# Deploy at https://dashboard.render.com -> New -> Blueprint -> select this repo.
#
# REQUIRED secrets (set in the Render dashboard -> Environment after the
# first sync, or add sync:false entries below before applying):
#   POLICYGUARD_AUTH_SECRET   - long random string (session token signing key)
#   POLICYGUARD_DEMO_PASSWORD - the officer demo password for the SIH demo
#   POLICYGUARD_CORS_ORIGINS  - your frontend origin, e.g. https://policyguardai.vercel.app
services:
  - type: web
    name: policyguard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    # Render injects PORT; the Dockerfile CMD reads it so the health check works.
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_PATH
        value: /tmp/storage
      # Free tier disks are not available; /tmp keeps uploads working per-instance.
      - key: POLICYGUARD_CORS_ORIGINS
        sync: false
      - key: POLICYGUARD_AUTH_SECRET
        sync: false
      - key: POLICYGUARD_DEMO_PASSWORD
        sync: false
